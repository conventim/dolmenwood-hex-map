name: Supabase daily query

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Select * from hex_notes
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body -sS \
            "$SUPABASE_URL/rest/v1/hex_notes?select=*" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -o /dev/null -w "HTTP %{http_code}\n"
