name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate public API URL
        run: |
          node --input-type=module -e '
            const url = new URL(process.env.PUBLIC_D1_API_URL || "");
            if (url.protocol !== "https:" || ["localhost", "127.0.0.1", "[::1]", "api.cloudflare.com", "dash.cloudflare.com"].includes(url.hostname)) {
              throw new Error("PUBLIC_D1_API_URL must be the public HTTPS URL of the notes backend");
            }
          '
        env:
          PUBLIC_D1_API_URL: ${{ secrets.PUBLIC_D1_API_URL }}
      - name: Build
        run: npm run build
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
          PUBLIC_D1_API_URL: ${{ secrets.PUBLIC_D1_API_URL }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
